<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#2e1065"/>
<stop offset="0.5" stop-color="#6d28d9"/>
<stop offset="1" stop-color="#2e1065"/>
</linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#d8b4fe" stop-opacity="0"/>
<stop offset="0.5" stop-color="#f5e8ff" stop-opacity="1"/>
<stop offset="1" stop-color="#d8b4fe" stop-opacity="0"/>
</linearGradient>
<clipPath id="line"><rect x="0" y="4" width="1000" height="4" rx="2"/></clipPath>
</defs>
<style>
.beam{animation:sweep 3.5s ease-in-out infinite}
@keyframes sweep{from{transform:translateX(-200px)}to{transform:translateX(1000px)}}
</style>
<rect x="0" y="4" width="1000" height="4" rx="2" fill="url(#base)"/>
<g clip-path="url(#line)">
<rect class="beam" x="0" y="0" width="200" height="12" fill="url(#beam)"/>
</g>
</svg>
